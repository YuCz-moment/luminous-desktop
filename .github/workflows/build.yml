name: Build Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install deps
        run: npm ci

      - name: Download Node sidecar (win-x64)
        shell: pwsh
        run: |
          $v = "v22.14.0"
          curl.exe -L -o node.zip "https://nodejs.org/dist/$v/node-$v-win-x64.zip"
          Expand-Archive node.zip -DestinationPath node-src -Force
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item "node-src/node-$v-win-x64/node.exe" src-tauri/binaries/node-x86_64-pc-windows-msvc.exe

      - name: Build Tauri app
        run: npm run build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Luminous-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe

  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install deps
        run: npm ci

      - name: Download Node sidecar (darwin-x64)
        run: |
          v="v22.14.0"
          curl -L -o node.tar.gz "https://nodejs.org/dist/$v/node-$v-darwin-x64.tar.gz"
          tar -xzf node.tar.gz
          mkdir -p src-tauri/binaries
          cp "node-$v-darwin-x64/bin/node" src-tauri/binaries/node-x86_64-apple-darwin

      - name: Build Tauri app
        run: npm run build

      - name: Zip .app bundle
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent "Luminous.app" "Luminous-macOS-Intel.app.zip"

      - name: Upload macOS Intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Luminous-macOS-Intel
          path: |
            src-tauri/target/release/bundle/macos/Luminous-macOS-Intel.app.zip
            src-tauri/target/release/bundle/dmg/*.dmg

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install deps
        run: npm ci

      - name: Download Node sidecar (darwin-arm64)
        run: |
          v="v22.14.0"
          curl -L -o node.tar.gz "https://nodejs.org/dist/$v/node-$v-darwin-arm64.tar.gz"
          tar -xzf node.tar.gz
          mkdir -p src-tauri/binaries
          cp "node-$v-darwin-arm64/bin/node" src-tauri/binaries/node-aarch64-apple-darwin

      - name: Build Tauri app
        run: npm run build

      - name: Zip .app bundle
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent "Luminous.app" "Luminous-macOS-AppleSilicon.app.zip"

      - name: Upload macOS Apple Silicon artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Luminous-macOS-AppleSilicon
          path: |
            src-tauri/target/release/bundle/macos/Luminous-macOS-AppleSilicon.app.zip
            src-tauri/target/release/bundle/dmg/*.dmg

  release:
    needs: [windows, macos-intel, macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          draft: true
          generate_release_notes: true
